<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Herr Schneider: outline of an Alpine hat with a feather; below it a face with dot eyes,
       a small pair of scissors for a nose, and a simple moustache. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#141414"/>
  <g fill="#141414" stroke="#f2f2f2" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- brim -->
    <path d="M160 522 Q512 448 864 522 Q512 596 160 522 Z"/>
    <!-- crown -->
    <path d="M330 522 L356 250 Q368 208 420 212 Q470 218 512 272 Q554 218 604 212 Q656 208 668 250 L694 522 Z"/>
    <!-- band -->
    <path d="M338 436 L686 436 M335 474 L689 474" fill="none"/>
    <!-- feather -->
    <path d="M372 462 C 320 420, 236 330, 232 236 C 300 280, 362 380, 372 462 Z"/>
    <path d="M372 462 C 330 400, 280 320, 246 254" fill="none" stroke-width="12"/>
    <path d="M292 340 L312 318 M318 380 L340 356 M344 418 L364 396" fill="none" stroke-width="12"/>
    <!-- eyes -->
    <circle cx="416" cy="628" r="17" fill="#f2f2f2" stroke="none"/>
    <circle cx="608" cy="628" r="17" fill="#f2f2f2" stroke="none"/>
    <!-- nose: a small pair of scissors pointing down, rings up, blades closed -->
    <circle cx="484" cy="646" r="26"/>
    <circle cx="540" cy="646" r="26"/>
    <path d="M494 670 L506 700 M530 670 L518 700" fill="none" stroke-width="14"/>
    <path d="M498 700 L490 796 L512 808 L534 796 L526 700 Z"/>
    <path d="M512 704 L512 808" fill="none" stroke-width="10"/>
    <circle cx="512" cy="700" r="12" fill="#f2f2f2" stroke="none"/>
    <!-- moustache: simple, thick, gently upturned -->
    <path d="M512 852 C 556 826, 626 816, 694 804 C 730 798, 748 816, 730 834 C 690 866, 598 878, 512 878 C 426 878, 334 866, 294 834 C 276 816, 294 798, 330 804 C 398 816, 468 826, 512 852 Z"/>
  </g>
</svg>
