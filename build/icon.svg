<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Herr Schneider: an Alpine hat with scissors in the band where the feather would go. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#141414"/>

  <!-- brim, back half -->
  <ellipse cx="512" cy="716" rx="372" ry="54" fill="#d9d9d9"/>

  <!-- crown: pinched Alpine shape with a centre dent -->
  <path d="M302 716 L336 338 Q350 292 410 296 Q470 302 512 366 Q554 302 614 296 Q674 292 688 338 L722 716 Z" fill="#ececec"/>
  <path d="M512 366 L508 470" stroke="#bdbdbd" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- scissors: in front of the crown; the blades are short and end inside the band -->
  <g transform="translate(412 604) rotate(-34)" fill="#f2f2f2" stroke="#141414" stroke-width="13" stroke-linejoin="round">
    <path d="M-20 0 L-36 62 L-2 62 L22 0 Z" transform="rotate(-4)"/>
    <path d="M-22 0 L2 62 L36 62 L20 0 Z" transform="rotate(4)"/>
    <path d="M-13 0 L-84 -128 L-50 -148 L13 0 Z"/>
    <path d="M13 0 L84 -128 L50 -148 L-13 0 Z"/>
    <path fill-rule="evenodd" d="M-78 -204 m-62 0 a62 62 0 1 0 124 0 a62 62 0 1 0 -124 0 M-78 -204 m-30 0 a30 30 0 1 1 60 0 a30 30 0 1 1 -60 0"/>
    <path fill-rule="evenodd" d="M78 -204 m-62 0 a62 62 0 1 0 124 0 a62 62 0 1 0 -124 0 M78 -204 m-30 0 a30 30 0 1 1 60 0 a30 30 0 1 1 -60 0"/>
    <circle cx="0" cy="0" r="16" fill="#141414" stroke="none"/>
  </g>

  <!-- band with cord: covers the blades -->
  <path d="M320 596 L306 684 L718 684 L704 596 Z" fill="#141414"/>
  <path d="M316 626 L708 626 M312 652 L712 652" stroke="#5a5a5a" stroke-width="5" fill="none"/>

  <!-- brim, front half -->
  <path d="M140 716 Q512 640 884 716 Q512 780 140 716 Z" fill="#f2f2f2"/>
  <path d="M140 716 Q512 640 884 716" stroke="#c9c9c9" stroke-width="8" fill="none"/>
</svg>
